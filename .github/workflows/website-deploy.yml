name: Website Deployment

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-deploy.yml"

jobs:
  deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '-deploy')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        working-directory: website
        run: npm ci

      - name: Build Project
        working-directory: website
        run: npm run build

      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          ssh_private_key: ${{ secrets.SSH_KEY }}
          local_path: "website/out/*"
          remote_path: ${{ secrets.FTP_DESTINATION }}
          delete_remote_files: true
          sftp_only: true

  # notify:
  #   name: Notify Team
  #   needs: [deploy]
  #   if: always() && contains(github.event.head_commit.message, '-deploy')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Send Status to Discord/Slack
  #       uses: rtCamp/action-slack-notify@v2
  #       env:
  #         SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  #         SLACK_COLOR: ${{ needs.deploy.result == 'success' && 'good' || 'danger' }}
  #         SLACK_MESSAGE: "Azure Website Deployment finished with status: ${{ needs.deploy.result }}"

  notify-email:
    name: Email Notification
    needs: [deploy]
    if: always() && contains(github.event.head_commit.message, '-deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Azure Website Deployment - ${{ needs.deploy.result }}
          to: ${{ secrets.MAIL_TO }}
          from: Azure Deployment <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deployment of Azure Website finished with status: ${{ needs.deploy.result }}

            Commit: ${{ github.event.head_commit.message }}
            Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

