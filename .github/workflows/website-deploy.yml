name: Website Deployment

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-deploy.yml"

jobs:
  deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '-deploy')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        working-directory: website
        run: npm ci

      - name: Build Project
        working-directory: website
        run: npm run build

      - name: Pre-deployment Clean (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.FTP_DESTINATION }}
            # Delete old files but exclude critical system ones
            find . -maxdepth 1 ! -name '.well-known' ! -name 'cgi-bin' ! -name '.htaccess' ! -name '.' -exec rm -rf {} +

      - name: Deploy Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "website/out/*"
          target: ${{ secrets.FTP_DESTINATION }}
          strip_components: 2
